
name: Build AURA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AURA Android 16 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AURA Project
        run: |
          python -m pip install gdown
          gdown "https://drive.google.com/uc?id=1-q35ZCQgkf770bcV-W1PaKkLk_UJmtXG" -O AURA.zip
          test -s AURA.zip
          mkdir source
          unzip -q AURA.zip -d source

      - name: Locate Project
        run: |
          PROJECT_DIR=$(find source -name gradlew -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update Android Configuration
        run: |
          sed -i 's/version "8.5.2"/version "8.6.1"/' "$PROJECT_DIR/build.gradle.kts"
          sed -i 's/compileSdk = 34/compileSdk = 36/; s/targetSdk = 34/targetSdk = 36/' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.7-bin.zip/' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "platform-tools"

      - name: Build AURA APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload AURA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AURA-ANDROID-16-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
