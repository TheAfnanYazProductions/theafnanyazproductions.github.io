name: Build AURA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AURA Android 16 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AURA Project
        run: |
          python -m pip install gdown
          gdown "https://drive.google.com/uc?id=1-q35ZCQgkf770bcV-W1PaKkLk_UJmtXG" -O AURA.zip
          test -s AURA.zip
          mkdir source
          unzip -q AURA.zip -d source

      - name: Locate Project
        run: |
          PROJECT_DIR=$(find source -name gradlew -type f -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Update Android Configuration
        run: |
          sed -i 's/version "8.5.2"/version "8.9.1"/' "$PROJECT_DIR/build.gradle.kts"
          sed -i 's/compileSdk = 34/compileSdk = 36/; s/targetSdk = 34/targetSdk = 36/' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.11.1-bin.zip/' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Setup Android SDK Environment
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Licenses and Install SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"

      - name: Repair Android Resources
        run: |
          RES="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES/values" "$RES/mipmap-anydpi"

          if ! grep -Rqs 'name="app_name"' "$RES" 2>/dev/null; then
            cat > "$RES/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">AURA</string>
          </resources>
          EOF
          fi

          if ! grep -Rqs 'name="Theme.Aura"' "$RES" 2>/dev/null; then
            cat > "$RES/values/aura_theme.xml" <<'EOF'
          <resources>
              <style name="Theme.Aura" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:colorAccent">#00D1FF</item>
                  <item name="android:statusBarColor">#080914</item>
                  <item name="android:navigationBarColor">#080914</item>
                  <item name="android:windowBackground">#080914</item>
              </style>
          </resources>
          EOF
          fi

          for ICON in ic_launcher ic_launcher_round; do
            if [ ! -f "$RES/mipmap-anydpi/$ICON.xml" ] && [ ! -f "$RES/mipmap-anydpi-v26/$ICON.xml" ]; then
              cat > "$RES/mipmap-anydpi/$ICON.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#080914"
                  android:pathData="M24,2 A22,22 0 1,0 24,46 A22,22 0 1,0 24,2"/>
              <path android:fillColor="#00D1FF"
                  android:pathData="M29,9 L29,29 C29,34 24,38 19,37 C15,36 14,32 17,29 C19,27 23,26 27,28 L27,13 L37,10 L37,15 L29,17 Z"/>
          </vector>
          EOF
            fi
          done

      - name: Configure Gradle Memory
        run: |
          cat >> "$PROJECT_DIR/gradle.properties" <<'EOF'

          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          org.gradle.caching=true
          EOF

      - name: Build AURA APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace assembleDebug

      - name: Upload AURA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AURA-ANDROID-16-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
