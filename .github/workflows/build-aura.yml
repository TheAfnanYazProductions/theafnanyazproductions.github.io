
name: Build AURA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AURA Project
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1-q35ZCQgkf770bcV-W1PaKkLk_UJmtXG" -O AURA.zip
          mkdir source
          unzip -q AURA.zip -d source

      - name: Locate Project
        run: |
          PROJECT_DIR=$(find source -name gradlew -type f -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Update Android Configuration
        run: |
          sed -i 's/version "8.5.2"/version "8.6.1"/' "$PROJECT_DIR/build.gradle.kts"
          sed -i 's/compileSdk = 34/compileSdk = 35/; s/targetSdk = 34/targetSdk = 35/' "$PROJECT_DIR/app/build.gradle.kts"
          sed -i 's/gradle-[0-9.]*-bin.zip/gradle-8.7-bin.zip/' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: source/**/build/outputs/apk/debug/*.apk
